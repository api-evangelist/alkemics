name: Alkemics

description: 'Alkemics was a French SaaS company founded in 2011 in Paris that operated a collaborative
  commerce platform connecting consumer packaged goods (CPG) brands and retailers to share, enrich, and
  distribute product content and data across the FMCG/grocery supply chain. Backed by investors including
  Partech, Cathay Innovation, and Serena, Alkemics was acquired by Salsify (a US product experience
  management company) in October 2020. The product now lives on as "SupplierXM by Salsify"; alkemics.com
  and docs.alkemics.com redirect to Salsify, and the successor developer documentation is hosted at
  docs.supplierxm.salsify.com. This company profile is preserved in the API Evangelist network with an
  honest acquisition/successor record. No independent Alkemics-owned API surface remains.'

