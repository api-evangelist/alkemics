openapi: 3.2.0
info:
  title: Alkemics Business Units API
  version: '2.1'
  description: 'Operations tagged Business Units across 2 of this provider''s published API definitions: alkemics-tenders-public-retailer-openapi.yml, alkemics-tenders-public-supplier-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apis.supplierxm.salsify.com/rfp/public/
security:
- sec0: []
tags:
- name: Business Units
paths:
  /v1/business_units:
    post:
      summary: Create BU
      description: ''
      operationId: create-bu
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_units:
                  properties:
                    code:
                      type: string
                      description: All business unit must have a unique `code`
                    event:
                      properties:
                        uuid:
                          type: string
                          description: The uuid of the event
                      required:
                      - uuid
                      type: object
                    data:
                      properties:
                        descriptionText:
                          type: string
                          description: The business unit name
                        limitDate:
                          type: string
                          description: The business unit's response deadline.
                      required:
                      - descriptionText
                      - limitDate
                      type: object
                  required:
                  - code
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"business_units\": [\n        {\n            \"uuid\": \"UNIQUE-ID-BU\",\n            \"code\": \"UNIQUE-CODE-BU\",\n            \"data\": {\n                \"descriptionText\": [\n                    {\n                        \"data\": \"Business Unit Name\",\n                        \"expressedIn\": {\n                            \"code\": \"fra-FR\",\n                            \"rank\": null,\n                            \"label\": \"fra-FR\",\n                            \"description\": \"fra-FR\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Language\",\n                            \"data\": {\n                                \"locale\": \"fr_FR\",\n                                \"GDSN3.1\": \"fr-250\",\n                                \"GDSN2.8\": \"fr-250\"\n                            },\n                            \"normalizedCode\": \"fr\"\n                        }\n                    }\n                ],\n                \"limitDate\": \"2022-03-23\"\n            },\n            \"event\": {\n                \"uuid\": \"UNIQUE-ID-EVENT\"\n            }\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  business_units:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: UNIQUE-ID-BU
                        code:
                          type: string
                          example: UNIQUE-CODE-BU
                        data:
                          type: object
                          properties:
                            descriptionText:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: string
                                    example: Business Unit Name
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: fra-FR
                                      rank: {}
                                      label:
                                        type: string
                                        example: fra-FR
                                      description:
                                        type: string
                                        example: fra-FR
                                      expressedIn:
                                        type: array
                                      _type:
                                        type: string
                                        example: Language
                                      data:
                                        type: object
                                        properties:
                                          locale:
                                            type: string
                                            example: fr_FR
                                          GDSN3.1:
                                            type: string
                                            example: fr-250
                                          GDSN2.8:
                                            type: string
                                            example: fr-250
                                      normalizedCode:
                                        type: string
                                        example: fr
                            limitDate:
                              type: string
                              example: '2022-03-23'
                        event:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: UNIQUE-ID-EVENT
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n     --url https://apis.supplierxm.salsify.com/rfp/public/v1/business_units \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer SALSIFY_TOKEN' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n        {\n          \"business_units\": [\n            {\n              \"code\": \"UNIQUE-CODE-BU\",\n              \"event\": {\n                \"uuid\": \"UNIQUE-ID-EVENT\"\n              },\n              \"data\": {\n                \"descriptionText\": [\n                  {\n                    \"data\": \"Business Unit Name\",\n                    \"expressedIn\": {\n                      \"code\": \"fra-FR\"\n                    }\n                  }\n                ],\n                \"limitDate\": \"2022-03-23\"\n              }\n            }\n          ]\n        }\n'"
        samples-languages:
        - curl
      tags:
      - Business Units
    put:
      summary: Update BU
      description: ''
      operationId: update-bu
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_units:
                  properties:
                    uuid:
                      type: string
                      description: The uuid of the business unit
                    data:
                      properties:
                        descriptionText:
                          type: string
                          description: The business unit name
                        limitDate:
                          type: string
                          description: The business unit's response deadline.
                      required:
                      - descriptionText
                      - limitDate
                      type: object
                  required:
                  - uuid
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"business_units\": [\n        {\n            \"uuid\": \"UNIQUE-ID-BU\",\n            \"code\": \"UNIQUE-CODE-BU\",\n            \"data\": {\n                \"descriptionText\": [\n                    {\n                        \"data\": \"Business Unit Name\",\n                        \"expressedIn\": {\n                            \"code\": \"fra-FR\",\n                            \"rank\": null,\n                            \"label\": \"fra-FR\",\n                            \"description\": \"fra-FR\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Language\",\n                            \"data\": {\n                                \"locale\": \"fr_FR\",\n                                \"GDSN3.1\": \"fr-250\",\n                                \"GDSN2.8\": \"fr-250\"\n                            },\n                            \"normalizedCode\": \"fr\"\n                        }\n                    }\n                ],\n                \"limitDate\": \"2022-03-23\"\n            },\n            \"event\": {\n                \"uuid\": \"UNIQUE-ID-EVENT\"\n                }\n            }\n        }\n    ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request PUT \\\n     --url https://apis.supplierxm.salsify.com/rfp/public/v1/business_units \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer SALSIFY_TOKEN' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n        {\n          \"business_units\": [\n            {\n              \"uuid\": \"UNIQUE-ID-BU\",\n              \"event\": {\n                \"uuid\": \"UNIQUE-ID-EVENT\"\n              },\n              \"data\": {\n                \"descriptionText\": [\n                  {\n                    \"data\": \"Business Unit Name\",\n                    \"expressedIn\": {\n                      \"code\": \"fra-FR\"\n                    }\n                  }\n                ],\n                \"limitDate\": \"2022-03-23\"\n              }\n            }\n          ]\n        }'"
        samples-languages:
        - curl
      tags:
      - Business Units
    get:
      summary: List BU
      description: ''
      operationId: list-bu
      parameters:
      - name: uuids
        in: query
        description: List of filtered business unit uuids
        schema:
          type: string
          default: UUID_1,UUID_2
      - name: offset
        in: query
        description: The index of the first business unit to be returned.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The maximum number of business units to be returned.
        schema:
          type: integer
          format: int32
          default: 20
      - name: from_updated_at
        in: query
        description: Filter business units for which the data has been updated at a certain date/time.
        schema:
          type: string
          format: date
      - name: to_updated_at
        in: query
        description: Filter business units for which the data has been updated at a certain date/time.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"business_units\": {\n        \"data\": [\n            {\n                \"data\": {\n                    \"uuid\": \"UNIQUE-ID-BU-1\",\n                    \"code\": \"UNIQUE-CODE-BU-1\",\n                    \"data\": {\n                        \"descriptionText\": [\n                            {\n                                \"data\": \"Business Unit Name 1\",\n                                \"expressedIn\": {\n                                    \"code\": \"fra-FR\",\n                                    \"rank\": null,\n                                    \"label\": \"fra-FR\",\n                                    \"description\": \"fra-FR\",\n                                    \"expressedIn\": [],\n                                    \"_type\": \"Language\",\n                                    \"data\": {\n                                        \"locale\": \"fr_FR\",\n                                        \"GDSN3.1\": \"fr-250\",\n                                        \"GDSN2.8\": \"fr-250\"\n                                    },\n                                    \"normalizedCode\": \"fr\"\n                                }\n                            }\n                        ],\n                        \"limitDate\": \"2022-03-23\"\n                    },\n                    \"event\": {\n                        \"uuid\": \"UNIQUE-ID-EVENT-1\"\n                        }\n                    }\n                }\n            },\n            {\n                \"data\": {\n                    \"uuid\": \"UNIQUE-ID-BU-2\",\n                    \"code\": \"UNIQUE-CODE-BU-2\",\n                    \"data\": {\n                        \"descriptionText\": [\n                            {\n                                \"data\": \"Business Unit Name 2\",\n                                \"expressedIn\": {\n                                    \"code\": \"fra-FR\",\n                                    \"rank\": null,\n                                    \"label\": \"fra-FR\",\n                                    \"description\": \"fra-FR\",\n                                    \"expressedIn\": [],\n                                    \"_type\": \"Language\",\n                                    \"data\": {\n                                        \"locale\": \"fr_FR\",\n                                        \"GDSN3.1\": \"fr-250\",\n                                        \"GDSN2.8\": \"fr-250\"\n                                    },\n                                    \"normalizedCode\": \"fr\"\n                                }\n                            }\n                        ],\n                        \"limitDate\": \"2022-04-30\"\n                    },\n                    \"event\": {\n                        \"uuid\": \"UNIQUE-ID-EVENT-2\"\n                        }\n                    }\n                }\n            }\n        ],\n        \"totalResults\": 161\n    }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Business Units
    delete:
      summary: Delete BU
      description: ''
      operationId: delete-bu
      parameters:
      - name: uuids
        in: query
        description: List of business unit uuids to delete
        schema:
          type: string
          default: UUID_1,UUID_2
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'null'
              schema: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Business Units
    servers:
    - url: https://apis.supplierxm.salsify.com/rfp/public/
  /v1/business_units/{uuid}/decline:
    post:
      summary: Decline BU
      description: ''
      operationId: decline-rfp
      parameters:
      - name: uuid
        in: path
        description: The uuid of the business unit to decline
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - declined
              properties:
                declined:
                  type: boolean
                  default: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'null'
              schema: {}
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"Business unit(s) ['UUID'] not found\",\n    \"status\": 404,\n    \"data\": {\n        \"message\": \"Business unit(s) ['UUID'] not found\",\n        \"code\": 404,\n        \"business_unit_ids\": [\n            \"UUID\"\n        ]\n    }\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Business unit(s) ['UUID'] not found
                  status:
                    type: integer
                    example: 404
                    default: 0
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Business unit(s) ['UUID'] not found
                      code:
                        type: integer
                        example: 404
                        default: 0
                      business_unit_ids:
                        type: array
                        items:
                          type: string
                          example: UUID
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n     --url https://apis.supplierxm.salsify.com/rfp/public/v1/business_units/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/decline \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer SALSIFY_TOKEN' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n        {\n\t\t\t\t    declined: true\n        }'"
        samples-languages:
        - curl
      tags:
      - Business Units
    servers:
    - url: https://apis.supplierxm.salsify.com/rfp/public/
  /v1/business_units/send/answers:
    post:
      summary: Send Answer
      description: ''
      operationId: send-answer
      parameters:
      - name: uuid
        in: query
        description: UUID of the business unit with the answers to send
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"sentAnswers\": 2\n}"
              schema:
                type: object
                properties:
                  sentAnswers:
                    type: integer
                    example: 2
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Business Units
    servers:
    - url: https://apis.supplierxm.salsify.com/rfp/public/
