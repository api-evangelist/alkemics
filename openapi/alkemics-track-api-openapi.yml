info:
  title: Alkemics Track API
  version: '2.1'
  description: 'Operations tagged Track across 3 of this provider''s published API definitions: alkemics-information-requests-openapi.yml, alkemics-product-openapi.yml, alkemics-supplier-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apis.supplierxm.salsify.com/public/v1/products/requests
- url: https://apis.supplierxm.salsify.com/public/v1/products
- url: https://apis.supplierxm.salsify.com/public/v1/supplier
security:
- sec0: []
tags:
- name: Track
paths:
  /track/{tracker_id}:
    get:
      summary: Request Engine import tracking
      description: ''
      operationId: request-engine-import-1
      parameters:
      - name: tracker_id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": \"SUCCESS\", \n  \"count\": 1, \n\t\"tracking\": 42, \n  \"products\": [\n    {\n      \"status\": \"SUCCESS\", \n      \"message\": \"\", \n      \"gtin\": \"0123456789123\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  count:
                    type: integer
                    example: 1
                    default: 0
                  tracking:
                    type: integer
                    example: 42
                    default: 0
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: SUCCESS
                        message:
                          type: string
                          example: ''
                        gtin:
                          type: string
                          example: 0123456789123
      deprecated: false
      tags:
      - Track
    servers:
    - url: https://apis.supplierxm.salsify.com/public/v1/products/requests
  /track/{tracking_id}:
    get:
      summary: Product inbound Tracking
      description: ''
      operationId: product-upsert-tracking
      parameters:
      - name: tracking_id
        in: path
        description: Tracking id as returned by the Product Upsert API
        schema:
          type: integer
          format: int32
        required: true
      - name: with_uuids
        in: query
        description: Return the uuid for each product.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"createdAt\": \"2018-03-05T08:00:10\",\n  \"status\": \"CONTAINS_ERRORS\",\n  \"count\": 2,\n  \"tracking\": 424242,\n  \"products\": [\n    {\n      \"gtin\": \"03663215000080\",\n      \"message\": \"Invalid value: GRMQ in referential weights.\",\n      \"status\": \"ERROR\"\n    },\n    {\n      \"gtin\": \"03663215111113\",\n      \"message\": \"\",\n      \"status\": \"SUCCESS\"\n    }\n  ],\n  \"user\": {\n  \t\"id\": 42,\n    \"username\": \"apiwriter@salsify.com\"\n  },\n  \"organization\": {\n    \"id\": 42,\n    \"nameLegal\": \"Test Organization\"\n  },\n  \"message\": \"\",\n  \"endpoint\": \"API\"\n}\n"
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                    example: '2018-03-05T08:00:10'
                  status:
                    type: string
                    example: CONTAINS_ERRORS
                  count:
                    type: integer
                    example: 2
                    default: 0
                  tracking:
                    type: integer
                    example: 424242
                    default: 0
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        gtin:
                          type: string
                          example: 03663215000080
                        message:
                          type: string
                          example: 'Invalid value: GRMQ in referential weights.'
                        status:
                          type: string
                          example: ERROR
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                        default: 0
                      username:
                        type: string
                        example: apiwriter@salsify.com
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                        default: 0
                      nameLegal:
                        type: string
                        example: Test Organization
                  message:
                    type: string
                    example: ''
                  endpoint:
                    type: string
                    example: API
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Track
    servers:
    - url: https://apis.supplierxm.salsify.com/public/v1/products
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows: {}
