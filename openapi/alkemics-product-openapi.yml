      summary: Search Products
      description: 'This method lists all the products you have access to.

        If you would like to call this API from this website, you will be asked to provide your authentication token, please prefix this token with following wording ''Bearer ''.'
      operationId: search-product
      parameters:
      - name: Accept-language
        in: header
        description: Filters by expected languages for labels associated to code values
        schema:
          type: string
          default: en
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status_shared_from:
                  type: integer
                  description: Filters the shared status of the source products (retailer specific). (DRAFT=2 / PENDING=3 / ACCEPTED=4)
                  format: int32
                status_shared_with:
                  type: integer
                  description: Filters the shared status of the target products (manufacturer specific). (DRAFT=2 / PENDING=3 / ACCEPTED=4)
                  format: int32
                updated_at_from:
                  type: string
                  description: Filters the minimum latest update date of the returned products (UNIX timestamp)
                  default: '1470643732'
                  format: date-time
                updated_at_to:
                  type: string
                  description: Filters the maximum latest update date of the returned products (UNIX timestamp)
                  format: date-time
                filter_gtins_in:
                  type: string
                  description: Filters by GTINs (several possible, comma-separated)
                  default: '03663215000110'
                filter_gmns_in:
                  type: string
                  description: Filters by GMNs (several possible, comma-separated)
                filter_target_market:
                  type: integer
                  description: Filters by target market (ISO 3166-1 numeric)
                  default: 250
                  format: int32
                filter_product_languages:
                  type: string
                  description: Filters by product languages (several possible, comma-separated)
                  default: fr
                filter_validation_status_in:
                  type: integer
                  description: Filters the data quality status (validation) of the products (several possible, comma-separated). (NA=0 / NOT OK=1 / OK=2 / CORRECTION=3)
                  format: int32
                filter_has_packshot_new:
                  type: boolean
                  description: Filters on products based on the presence/absence a packshot.
                filter_pictures_last_updated_at_from:
                  type: string
                  description: Filters the minimum latest update date for the images (milliseconds since 01/01/1970)
                  format: date-time
                filter_pictures_last_updated_at_to:
                  type: string
                  description: Filters the maximum latest update date for the images (milliseconds since 01/01/1970)
                  format: date-time
                filter_tags_in:
                  type: string
                  description: Filter products depending on a specific tag. Returns all products for which the specified tag is on
                filter_tags_not_in:
                  type: string
                  description: Filter products depending on a specific tag. Returns all products for which the specified tag is off
                filter_source_include:
                  type: string
                  description: Filters the fields returned by the API (fields are comma separated)
                  default: description
                filter_source_exclude:
                  type: string
                  description: Filters the fields returned by the API (fields are comma separated)
                filter_active_range:
                  type: boolean
                  description: Identifies products part of the retailer's active range
                filter_quality_changed_at_from:
                  type: string
                  description: Filters the minimum latest quality update date of the returned products.
                  format: date-time
                filter_quality_changed_at_to:
                  type: string
                  description: Filters the maximum latest quality update date of the returned products.
                  format: date-time
                filter_lifecycle_in:
                  type: integer
                  description: Filters the lifecycle status of the source products. (PRELAUNCH=0 / PURCHASABLE=1 / NOT_PURCHASABLE=2 / ARCHIVED=3)
                  format: int32
                limit:
                  type: integer
                  description: The maximum number of products to be returned. The max value allowed is 500.
                  default: 20
                  format: int32
                offset:
                  type: integer
                  description: The index of the first product to be returned
                  default: 0
                  format: int32
                next_page:
                  type: integer
                  description: To use scroll search when you need to retrieve more than 10K products (see https://docs.supplierxm.salsify.com/docs/retrieve-product#using-the-pagination-system for more info)
                  format: int64
                decrypt_price:
                  type: integer
                  description: 'Decrypt price if possible (based on permission). Possible values are : false, true.'
                  default: null
                  format: int32
                advanced_search:
                  type: string
                  description: See details up, section "Some details on..."
                  format: json
                sort_by:
                  type: string
                  description: sort the element according to the field specified
            examples:
              Request Example:
                value:
                  advanced_search:
                    must:
                    - query: jam
                      fields:
                      - namePublicLong.data
                      - kind.label
                      - description.data
                    - query: organic
                      fields:
                      - namePublicLong.data
                      - description.data
                    - query: raspberry
                      fields:
                      - namePublicLong.data
                      - description.data
                      - composition.data
                  offset: 0
                  limit: 20
