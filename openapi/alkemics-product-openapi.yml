openapi: 3.1.0
info:
  title: product
  version: '2.1'
servers:
- url: https://apis.supplierxm.salsify.com/public/v1/products
security:
- sec0: []
x-readme-fauxas: true
paths:
  /:
    get:
      summary: List Products
      description: This method lists all the products you have access to.
      operationId: list-products
      parameters:
      - name: status_shared_from
        in: query
        description: Filters the shared status of the source products. (DRAFT=2 / PENDING=3 / ACCEPTED=4 / ARCHIVED=1 / DELETED=0 / PAUSED=6 / REFUSED=5)
        schema:
          type: integer
          format: int32
      - name: status_shared_with
        in: query
        description: Filters the shared status of the target products. (DRAFT=2 / PENDING=3 / ACCEPTED=4 / ARCHIVED=1 / DELETED=0 / PAUSED=6 / REFUSED=5)
        schema:
          type: integer
          format: int32
      - name: updated_at_from
        in: query
        description: Filters the minimum latest update date of the returned products (UNIX timestamp)
        schema:
          type: string
          format: date-time
      - name: updated_at_to
        in: query
        description: Filters the maximum latest update date of the returned products (UNIX timestamp)
        schema:
          type: string
          format: date-time
      - name: filter_gtins_in
        in: query
        description: Filters by GTINs (several possible, comma-separated)
        schema:
          type: string
          default: '03663215000110'
      - in: query
        name: filter_gmns_in
        schema:
          type: string
        description: Filters by GMNs (several possible, comma-separated)
      - name: filter_target_market
        in: query
        description: Filters by target market (ISO 3166-1 numeric)
        schema:
          type: integer
          format: int32
          default: 250
      - name: filter_product_languages
        in: query
        description: Filters by product languages (several possible, comma-separated)
        schema:
          type: string
          default: fr
      - name: filter_validation_status_in
        in: query
        description: Filters the data quality status (validation) of the products (several possible, comma-separated). (NA=0 / NOT OK=1 / OK=2 / CORRECTION=3)
        schema:
          type: integer
          format: int32
      - name: filter_has_packshot_new
        in: query
        description: Filters on products based on the presence/absence a packshot.
        schema:
          type: boolean
      - name: filter_pictures_last_updated_at_from
        in: query
        description: Filters the minimum latest update date for the images (milliseconds since 01/01/1970)
        schema:
          type: string
          format: date-time
      - name: filter_pictures_last_updated_at_to
        in: query
        description: Filters the maximum latest update date for the images (milliseconds since 01/01/1970)
        schema:
          type: string
          format: date-time
      - name: filter_tags_in
        in: query
        description: Filter products depending on a specific tag. Returns all products for which the specified tag is on
        schema:
          type: string
      - name: filter_tags_not_in
        in: query
        description: Filter products depending on a specific tag. Returns all products for which the specified tag is off
        schema:
          type: string
      - name: filter_source_include
        in: query
        description: Filters the fields returned by the API (fields are comma separated)
        schema:
          type: string
      - name: filter_source_exclude
        in: query
        description: Filters the fields returned by the API (fields are comma separated)
        schema:
          type: string
      - name: filter_quality_changed_at_from
        in: query
        description: Filters the minimum latest quality update date of the returned products.
        schema:
          type: string
          format: date-time
      - name: filter_quality_changed_at_to
        in: query
        description: Filters the maximum latest quality update date of the returned products.
        schema:
          type: string
          format: date-time
      - name: filter_lifecycle_in
        in: query
        description: Filters the lifecycle status of the source products. (PRELAUNCH=0 / PURCHASABLE=1 / NOT_PURCHASABLE=2 / ARCHIVED=3)
        schema:
          type: integer
          format: int32
      - name: filter_is_requested
        in: query
        description: Identifies products part of the retailer's active range = products you have uploaded to SupplierXM. Products that manufacturers push proactively have a value "false"
        schema:
          type: boolean
      - name: filter_request_product_status_in
        in: query
        description: Filters by request statuses (several possible, comma-separated). Values ACCEPTED, PENDING, REFUSED, RECIPIENT_NOT_RECONCILED
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of products to be returned. The max value allowed is 500
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: The index of the first product to be returned
        schema:
          type: integer
          format: int32
          default: 0
      - name: next_page
        in: query
        description: To use scroll search when you need to retrieve more than 10K products (see end of step 3 at https://docs.supplierxm.salsify.com/docs/getting-started for more info)
        schema:
          type: integer
          format: int64
      - name: decrypt_price
        in: query
        description: 'Decrypt price if possible (based on permission). Possible values are : false, true.'
        schema:
          type: boolean
      - name: advanced_search
        in: query
        description: 'See details in "Search Products": https://docs.supplierxm.salsify.com/reference/search-product'
        schema:
          type: string
          format: json
      - name: sort_by
        in: query
        description: sort the element according to the field specified
        schema:
          type: string
      - name: filter_active_range
        in: query
        description: '[DEPRECATED] Identifies products part of the retailer''s active range = products you have uploaded to SupplierXM. Products that manufacturers push proactively have a value "false"'
        schema:
          type: boolean
      - name: Accept-language
        in: header
        description: Filters by expected languages for labels associated to code values
        schema:
          type: string
          default: fr
