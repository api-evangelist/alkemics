paths:
  /v1/answers:
    get:
      summary: List Answer
      description: ''
      operationId: list-answer-retailer
      parameters:
      - name: offset
        in: query
        description: The index of the first proposal to be returned.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The maximum number of proposals to be returned.
        schema:
          type: integer
          format: int32
          default: 20
      - name: start_date
        in: query
        description: Filter proposals for which the data has been updated on manufacturer side at a certain date/time.
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Filter proposals for which the data has been updated on manufacturer side at a certain date/time.
        schema:
          type: string
          format: date
      - name: business_unit_uuids
        in: query
        description: Filter by business units uuid
        schema:
          type: array
          items:
            type: string
      - name: answer_uuids
        in: query
        description: Filter by proposals uuid
        schema:
          type: array
          items:
            type: string
      - name: target_status_updated_at_from
        in: query
        description: Filter proposals for which the selection status has been updated after a certain timestamp.
        schema:
          type: string
          format: date
      - name: target_status_updated_at_to
        in: query
        description: Filter proposals for which the selection status has been updated before a certain timestamp.
        schema:
          type: string
          format: date
      - name: statuses
        in: query
        description: Filter proposals by selection status (NEED_REVIEW, UPDATE_REQUESTED, UPDATE_RECEIVED, PRE_SELECTED, SELECTED, REJECTED, SELECTED_NOTIFIED, REJECTED_NOTIFIED)
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"answers\": [\n        {\n          \t\"uuid\": \"ANSWER_UUID_2\",\n            \"product\": {\n                \"gtin\": \"11111111111111\",\n                \"label\": \"11111111111111 - PACK-TO-SHARE\"\n            },\n            \"data\": {\n                \"isExclusive\": false,\n                \"hierarchyProduct\": {\n                    \"gtin\": \"22222222222222\",\n                    \"label\": \"22222222222222 - colis - PACK-TO-SHARE\",\n                    \"uuid\": \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\n                },\n                \"comment\": [\n                    {\n                        \"data\": \".\",\n                        \"expressedIn\": {\n                            \"code\": \"fra-FR\",\n                            \"rank\": null,\n                            \"label\": \"fra-FR\",\n                            \"description\": \"fra-FR\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Language\",\n                            \"data\": {\n                                \"locale\": \"fr_FR\",\n                                \"GDSN3.1\": \"fr-250\",\n                                \"GDSN2.8\": \"fr-250\"\n                            },\n                            \"normalizedCode\": \"fr\"\n                        }\n                    }\n                ],\n                \"contractNumber\": \"2\",\n                \"currency\": {\n                    \"code\": \"EUR\",\n                    \"rank\": null,\n                    \"label\": \"euro\",\n                    \"description\": \"Euro\",\n                    \"expressedIn\": [],\n                    \"_type\": \"Currency\",\n                    \"data\": {\n                        \"GDSN3.1\": \"EUR\",\n                        \"GDSN2.8\": \"EUR\"\n                    }\n                },\n                \"recommendedRetailPriceNumber\": [\n                    {\n                        \"data\": 1.5,\n                        \"expressedIn\": {\n                            \"code\": \"EUR\",\n                            \"rank\": null,\n                            \"label\": \"euro\",\n                            \"description\": \"Euro\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Currency\",\n                            \"data\": {\n                                \"GDSN3.1\": \"EUR\",\n                                \"GDSN2.8\": \"EUR\"\n                            }\n                        }\n                    }\n                ]\n            },\n            \"status\": \"UPDATE_REQUESTED\",\n            \"target_status_updated_at\": \"2022-10-11T08:16:50\",\n          \t\"update_requested_message\": \"Message 1\",\n            \"rfp\": {\n                \"uuid\": \"RFP_UUID_1\"\n            },\n            \"has_been_notified\": false,\n            \"reception_date\": \"2022-06-23T12:37:24\",\n            \"last_received_at\": \"2022-06-23T12:37:24\"\n        }\n    ],\n    \"totalResults\": 508\n}"
              schema:
                type: object
                properties:
                  answers:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: ANSWER_UUID_2
                        product:
                          type: object
                          properties:
                            gtin:
                              type: string
                              example: '11111111111111'
                            label:
                              type: string
                              example: 11111111111111 - PACK-TO-SHARE
                        data:
                          type: object
                          properties:
                            isExclusive:
                              type: boolean
                              example: false
                              default: true
                            hierarchyProduct:
                              type: object
                              properties:
                                gtin:
                                  type: string
                                  example: '22222222222222'
                                label:
                                  type: string
                                  example: 22222222222222 - colis - PACK-TO-SHARE
                                uuid:
                                  type: string
                                  example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                            comment:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: string
                                    example: .
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: fra-FR
                                      rank: {}
                                      label:
                                        type: string
                                        example: fra-FR
                                      description:
                                        type: string
                                        example: fra-FR
                                      expressedIn:
                                        type: array
                                      _type:
                                        type: string
                                        example: Language
                                      data:
                                        type: object
                                        properties:
                                          locale:
                                            type: string
                                            example: fr_FR
                                          GDSN3.1:
                                            type: string
                                            example: fr-250
                                          GDSN2.8:
                                            type: string
                                            example: fr-250
                                      normalizedCode:
                                        type: string
                                        example: fr
                            contractNumber:
                              type: string
                              example: '2'
                            currency:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: EUR
                                rank: {}
                                label:
                                  type: string
                                  example: euro
                                description:
                                  type: string
                                  example: Euro
                                expressedIn:
                                  type: array
                                _type:
                                  type: string
                                  example: Currency
                                data:
                                  type: object
                                  properties:
                                    GDSN3.1:
                                      type: string
                                      example: EUR
                                    GDSN2.8:
                                      type: string
                                      example: EUR
                            recommendedRetailPriceNumber:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: number
                                    example: 1.5
                                    default: 0
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: EUR
                                      rank: {}
                                      label:
                                        type: string
                                        example: euro
                                      description:
                                        type: string
                                        example: Euro
                                      expressedIn:
                                        type: array
                                      _type:
                                        type: string
                                        example: Currency
                                      data:
                                        type: object
                                        properties:
                                          GDSN3.1:
                                            type: string
                                            example: EUR
                                          GDSN2.8:
                                            type: string
                                            example: EUR
                        status:
                          type: string
                          example: UPDATE_REQUESTED
                        target_status_updated_at:
                          type: string
                          example: '2022-10-11T08:16:50'
                        update_requested_message:
                          type: string
                          example: Message 1
                        rfp:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: RFP_UUID_1
                        has_been_notified:
                          type: boolean
                          example: false
                          default: true
                        reception_date:
                          type: string
                          example: '2022-06-23T12:37:24'
                        last_received_at:
                          type: string
                          example: '2022-06-23T12:37:24'
                  totalResults:
                    type: integer
                    example: 508
                    default: 0
        '400':
