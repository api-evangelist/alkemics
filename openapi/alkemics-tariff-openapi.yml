openapi: 3.1.0
info:
  title: tariff
  version: '2.1'
servers:
- url: https://apis.supplierxm.salsify.com/public/v1/tariffs
security:
- sec0: []
x-readme-fauxas: true
paths:
  /:
    get:
      summary: Tariff list
      description: ''
      operationId: tariff-list
      parameters:
      - name: uuids
        in: query
        description: Filters on given uuids
        schema:
          type: array
          items:
            type: string
      - name: updated_at_from
        in: query
        description: Filter tariffs that have been updated after a certain timestamp.
        schema:
          type: string
          format: date-time
      - name: updated_at_to
        in: query
        description: Filter tariffs that have been updated before a certain timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Limit the results fetched. Cannot be greater than 100.
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: Offset the results fetched.
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"totalResults\": 1,\n  \"offset\": 0,\n  \"data\": [\n    {\n    \t\"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\",\n      \"status\": \"PUBLISHED\",\n      \"name\": \"Tariff 2019\",\n      \"sourceOrganization\": {\n        \"nameLegal\": \"Manufacturer A\"\n      },\n      \"updatedAt\": \"2021-05-26T12:53:11\",\n      \"data\": {\n      \t\"orderStartDate\": \"2021-01-01\",\n      \t\"orderEndDate\": \"2021-12-31\",\n      \t\"targetCountryList\": [{\"targetCountryCode\": {\"code\": \"FR\"}}],\n      \t\"incotermCode\": {\"code\": \"EXW\"},\n      \t\"tariffNumber\": \"tariff1\",\n      \t\"tariffCurrency\": {\"code\": \"EUR\"},\n      \t\"priceWaterfallBasisQuantityNumber\": [{\"data\": 1, \"expressedIn\": {\"code\": \"BX\"}}],\n      \t\"priceWaterfalls\": [{\n        \t\"bracketUnit\": {\"code\": \"ctn\"},\n          \"brackets\": [{\"min\": 1}, {\"min\": 10}]\n        }]\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  totalResults:
                    type: integer
                    example: 1
                    default: 0
                  offset:
                    type: integer
                    example: 0
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: aaaaaaaa-bbbb-cccc-dddd-1234567890ab
                        status:
                          type: string
                          example: PUBLISHED
                        name:
                          type: string
                          example: Tariff 2019
                        sourceOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Manufacturer A
                        updatedAt:
                          type: string
                          example: '2021-05-26T12:53:11'
                        data:
                          type: object
                          properties:
                            orderStartDate:
                              type: string
                              example: '2021-01-01'
                            orderEndDate:
                              type: string
                              example: '2021-12-31'
                            targetCountryList:
                              type: array
                              items:
                                type: object
                                properties:
                                  targetCountryCode:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: FR
                            incotermCode:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: EXW
                            tariffNumber:
                              type: string
                              example: tariff1
                            tariffCurrency:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: EUR
                            priceWaterfallBasisQuantityNumber:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: integer
                                    example: 1
                                    default: 0
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: BX
                            priceWaterfalls:
                              type: array
                              items:
                                type: object
                                properties:
                                  bracketUnit:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: ctn
                                  brackets:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        min:
                                          type: integer
                                          example: 1
                                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    post:
      summary: Tariff update
      description: ''
      operationId: tariff-upsert
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"data\": [\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"priceWaterfalls\": [\n          {\n            \"bracketUnit\": {\n              \"code\": \"eur\",\n              \"description\": \"Euro\",\n              \"label\": \"euro\"\n            },\n            \"brackets\": [\n              {\n                \"min\": 1\n              },\n              {\n                \"min\": 10\n              }\n            ],\n            \"levels\": [\n              {\n                \"items\": [\n                  {\n                    \"description\": \"Prix brut\",\n                    \"type\": {\n                      \"code\": \"grossPrice\",\n                      \"key\": \"grossPrice\",\n                      \"label\": \"Gross price\"\n                    },\n                    \"unit\": {\n                      \"code\": \"$\",\n                      \"description\": \"Absolute unit type\",\n                      \"\
                    label\": \"Amount\"\n                    },\n                    \"uuid\": \"aaaaaaaa-1234-cccc-dddd-1234567890ab\",\n                    \"values\": [\n                      {\n                        \"uuid\": \"1\",\n                        \"value\": \"\"\n                      },\n                      {\n                        \"uuid\": \"2\",\n                        \"value\": \"\"\n                      }\n                    ]\n                  }\n                ],\n                \"type\": {\n                  \"code\": \"price\",\n                  \"description\": \"Price level type\",\n                  \"label\": \"HT Tariff\"\n                },\n                \"uuid\": \"aaaaaaaa-1234-bbbb-cccc-1234567890ab\"\n              }\n            ],\n            \"product\": null,\n            \"taxes\": []\n          }\n        ],\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"756\",\n  \
                    \            \"description\": \"Switzerland\",\n              \"label\": \"Switzerland\"\n            }\n          }\n        ]\n      },\n      \"name\": \"Tariff test public with GLN\",\n      \"sourceOrganization\": {\n        \"nameLegal\": \"Source organization - supplier\"\n      },\n      \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"nameLegal\": \"Target organization - retailer\"\n      },\n      \"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\"\n    }\n  ],\n  \"status\": \"ok\"\n}"
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        data:
                          type: object
                          properties:
                            orderStartDate:
                              type: string
                              example: '2019-05-17'
                            priceWaterfalls:
                              type: array
                              items:
                                type: object
                                properties:
                                  bracketUnit:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: eur
                                      description:
                                        type: string
                                        example: Euro
                                      label:
                                        type: string
                                        example: euro
                                  brackets:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        min:
                                          type: integer
                                          example: 1
                                          default: 0
                                  levels:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        items:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              description:
                                                type: string
                                                example: Prix brut
                                              type:
                                                type: object
                                                properties:
                                                  code:
                                                    type: string
                                                    example: grossPrice
                                                  key:
                                                    type: string
                                                    example: grossPrice
                                                  label:
                                                    type: string
                                                    example: Gross price
                                              unit:
                                                type: object
                                                properties:
                                                  code:
                                                    type: string
                                                    example: $
                                                  description:
                                                    type: string
                                                    example: Absolute unit type
                                                  label:
                                                    type: string
                                                    example: Amount
                                              uuid:
                                                type: string
                                                example: aaaaaaaa-1234-cccc-dddd-1234567890ab
                                              values:
                                                type: array
                                                items:
                                                  type: object
                                                  properties:
                                                    uuid:
                                                      type: string
                                                      example: '1'
                                                    value:
                                                      type: string
                                                      example: ''
                                        type:
                                          type: object
                                          properties:
                                            code:
                                              type: string
                                              example: price
                                            description:
                                              type: string
                                              example: Price level type
                                            label:
                                              type: string
                                              example: HT Tariff
                                        uuid:
                                          type: string
                                          example: aaaaaaaa-1234-bbbb-cccc-1234567890ab
                                  product: {}
                                  taxes:
                                    type: array
                            targetCountryList:
                              type: array
                              items:
                                type: object
                                properties:
                                  targetCountryCode:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: '756'
                                      description:
                                        type: string
                                        example: Switzerland
                                      label:
                                        type: string
                                        example: Switzerland
                        name:
                          type: string
                          example: Tariff test public with GLN
                        sourceOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Source organization - supplier
                        status:
                          type: string
                          example: DRAFT
                        targetOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Target organization - retailer
                        uuid:
                          type: string
                          example: aaaaaaaa-bbbb-cccc-dddd-1234567890ab
                  status:
                    type: string
                    example: ok
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl -H 'Authorization: Bearer SALSIFY_TOKEN' -XPOST 'https://apis.supplierxm.salsify.com/public/v1/tariffs' -H 'Content-Type: application/json' -d '{\n  \"data\": [\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"tariffNumber\": \"2019-123456-00\",\n        \"orderEndDate\": null,\n        \"incotermCode\": {\n          \"code\": \"FCA\",\n          \"description\": \"Free carrier\",\n          \"label\": \"FREE CARRIER\"\n        },\n        \"tariffCurrency\": {\n          \"code\": \"EUR\",\n          \"label\": \"euro\",\n          \"key\": \"EUR\"\n        },\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"250\",\n              \"description\": \"France\",\n              \"label\": \"France\"\n            }\n          }\n        ],\n        \"priceWaterfallBasisQuantityNumber\": [\n          {\n            \"expressedIn\": {\n              \"code\": \"cnt\",\n        \
            \      \"description\": \"count\",\n              \"label\": \"count\"\n            },\n            \"data\": 1\n          }\n        ],\n        \"priceWaterfalls\": [\n          {\n            \"bracketUnit\": {\n              \"code\": \"eur\"\n            },\n            \"brackets\": [\n              {\n                \"min\": 1\n              },\n              {\n                \"min\": 10\n              }\n            ],\n            \"levels\": [\n              {\n                \"items\": [\n                  {\n                    \"description\": \"Prix brut\",\n                    \"type\": {\n                      \"code\": \"grossPrice\"\n                    },\n                    \"unit\": {\n                      \"code\": \"$\"\n                    },\n                    \"uuid\": \"aaaaaaaa-1234-cccc-dddd-1234567890ab\",\n                    \"values\": [\n                      {\n                        \"uuid\": \"1\",\n                        \"value\"\
            : \"\"\n                      },\n                      {\n                        \"uuid\": \"2\",\n                        \"value\": \"\"\n                      }\n                    ]\n                  }\n                ],\n                \"type\": {\n                  \"code\": \"price\"\n                },\n                \"uuid\": \"aaaaaaaa-1234-bbbb-cccc-1234567890ab\"\n              }\n            ],\n            \"product\": null,\n            \"taxes\": []\n          }\n        ]\n      },\n      \"name\": \"Tariff test public with GLN\",\n      \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"gln\": \"3663836000117\"\n      },\n      \"type\": 0\n    },\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"756\"\n            }\n          }\n        ]\n      },\n      \"name\": \"Tariff 2 updated with GLN\",\n    \
            \  \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"gln\": \"12345678\",\n        \"id\": 123,\n        \"nameLegal\": \"Senate Retailer 1\"\n      },\n      \"type\": 0,\n      \"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\"\n    }\n  ]\n}'\n"
        samples-languages:
        - curl
  /{uuid}/products:
    get:
      summary: Products list
      description: ''
      operationId: products-list
      parameters:
      - name: limit
        in: query
        description: Limit the results fetched. Cannot be greater than 100.
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: Offset the results fetched.
        schema:
          type: integer
          format: int32
          default: 0
      - name: uuid
        in: path
        description: The UUID of the tariff for which you are querying the products. It is found in the output of the tariffs list.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"totalResults\": 1,\n  \"offset\": 0,\n  \"data\": [{\n    \"gtin\": \"01234567891231\",\n    \"uuid\": \"12345678-aaaa-bbbb-cccc-1234567890ab\",\n    \"supplierId\": \"123456\",\n    \"data\": {\n      \"contractNumber\": \"1234-12345-12\",\n      \"hierarchyProduct\": {\n        \"gtin\": \"11234567891238\",\n        \"uuid\": \"12345678-aaaa-bbbb-cccc-abcdefabcdef\"\n      },\n\n      \"priceWaterfalls\": [{\n\n        \"brackets\": [{\n          \"min\": 1\n        }, {\n          \"min\": 10\n        }],\n        \"levels\": [{\n          \"items\": [{\n            \"values\": [{\n              \"value\": \"10\"\n            }, {\n              \"value\": \"9\"\n            }]\n          }]\n        }]\n      }]\n    }\n  }]\n}"
              schema:
                type: object
                properties:
                  totalResults:
                    type: integer
                    example: 1
                    default: 0
                  offset:
                    type: integer
                    example: 0
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        gtin:
                          type: string
                          example: 01234567891231
                        uuid:
                          type: string
                          example: 12345678-aaaa-bbbb-cccc-1234567890ab
                        supplierId:
                          type: string
                          example: '123456'
                        data:
                          type: object
                          properties:
                            contractNumber:
                              type: string
                              example: 1234-12345-12
                            hierarchyProduct:
                              type: object
                              properties:
                                gtin:
                                  type: string
                                  example: '11234567891238'
                                uuid:
                                  type: string
                                  example: 12345678-aaaa-bbbb-cccc-abcdefabcdef
                            priceWaterfalls:
                              type: array
                              items:
                                type: object
                                properties:
                                  brackets:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        min:
                                          type: integer
                                          example: 1
                                          default: 0
                                  levels:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        items:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              values:
                                                type: array
                                                items:
                                                  type: object
                                                  properties:
                                                    value:
                                                      type: string
                                                      example: '10'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
