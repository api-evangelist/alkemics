            : \"12\"\n                      },\n                      {\n                        \"value\": \"10\"\n                      }\n                    ]\n                  }\n                ],\n                \"type\": {\n                  \"code\": \"price\",\n                  \"description\": \"Price level type\",\n                  \"label\": \"HT Tariff\"\n                }\n              }\n            ],\n            \"product\": {\n              \"gtin\": \"12345678901234\"\n            },\n            \"taxes\": []\n          }\n        ]\n      },\n      \"gtin\": \"23456789012345\",\n      \"supplierId\": null\n    },\n    {\n      \"data\": {\n        \"contractNumber\": \"\",\n        \"priceWaterfalls\": [\n          {\n            \"bracketUnit\": null,\n            \"brackets\": [\n              {\n                \"min\": 1\n              },\n              {\n                \"min\": 10\n              }\n            ],\n            \"levels\": [\n           \
