info:
  title: tenders-public-supplier Messages API
  version: '2.1'
servers:
- url: https://apis.supplierxm.salsify.com/rfp/public/
security:
- sec0: []
tags:
- name: Messages
paths:
  /v1/messages:
    get:
      summary: List Message
      description: ''
      operationId: list-message-supplier
      parameters:
      - name: offset
        in: query
        description: The index of the first event to be returned.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The maximum number of events to be returned.
        schema:
          type: integer
          format: int32
          default: 20
      - name: business_unit_uuid
        in: query
        description: UUID of the business unit you want the messages from
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"you\": {\n        \"acknowledged_at\": \"2022-04-25T15:27:41\",\n        \"acknowledged_by\": \"Your Name\"\n    },\n    \"other_participant\": {\n        \"name\": \"Name of the other participant\",\n        \"acknowledged_at\": \"2021-03-17T15:11:33\"\n    },\n    \"messages\": [\n        {\n            \"message\": \"Message 3\",\n            \"content_type\": null,\n            \"emitter\": {\n                \"message_issuer_type\": \"supplier\",\n                \"name\": \"Your Name\"\n            },\n            \"createdAt\": \"2022-04-25T15:27:41\"\n        },\n        {\n            \"message\": \"Message 2\",\n            \"content_type\": null,\n            \"emitter\": {\n                \"message_issuer_type\": \"retailer\",\n                \"name\": \"Name of the other participant\"\n            },\n            \"createdAt\": \"2021-03-17T15:11:33\"\n        },\n        {\n            \"message\": \"Message 1\",\n            \"content_type\": null,\n            \"emitter\": {\n                \"message_issuer_type\": \"retailer\",\n                \"name\": \"Name of the other participant\"\n            },\n            \"createdAt\": \"2021-03-17T15:00:13\"\n        }\n    ],\n    \"totalResults\": 3\n}"
              schema:
                type: object
                properties:
                  you:
                    type: object
                    properties:
                      acknowledged_at:
                        type: string
                        example: '2022-04-25T15:27:41'
                      acknowledged_by:
                        type: string
                        example: Your Name
                  other_participant:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Name of the other participant
                      acknowledged_at:
                        type: string
                        example: '2021-03-17T15:11:33'
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Message 3
                        content_type: {}
                        emitter:
                          type: object
                          properties:
                            message_issuer_type:
                              type: string
                              example: supplier
                            name:
                              type: string
                              example: Your Name
                        createdAt:
                          type: string
                          example: '2022-04-25T15:27:41'
                  totalResults:
                    type: integer
                    example: 3
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Messages
