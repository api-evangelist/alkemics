openapi: 3.2.0
info:
  title: Alkemics Events API
  version: '2.1'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: alkemics-tenders-public-retailer-openapi.yml, alkemics-tenders-public-supplier-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apis.supplierxm.salsify.com/rfp/public/
security:
- sec0: []
tags:
- name: Events
paths:
  /v1/events:
    post:
      summary: Create Event
      description: ''
      operationId: create-event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  properties:
                    code:
                      type: string
                      description: All event must have a unique `code`
                    data:
                      properties:
                        descriptionText:
                          type: string
                          description: The event name
                        startDate:
                          type: string
                          description: The event start date
                        endDate:
                          type: string
                          description: The event end date
                      required:
                      - descriptionText
                      - startDate
                      - endDate
                      type: object
                  required:
                  - code
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"events\": [\n        {\n            \"uuid\": \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\",\n            \"code\": \"UNIQUE-CODE-EVENT\",\n            \"data\": {\n                \"descriptionText\": [\n                    {\n                        \"data\": \"Event 1\",\n                        \"expressedIn\": {\n                            \"code\": \"fra-FR\",\n                            \"rank\": null,\n                            \"label\": \"fra-FR\",\n                            \"description\": \"fra-FR\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Language\",\n                            \"data\": {\n                                \"locale\": \"fr_FR\",\n                                \"GDSN3.1\": \"fr-250\",\n                                \"GDSN2.8\": \"fr-250\"\n                            },\n                            \"normalizedCode\": \"fr\"\n                        }\n                    }\n                ],\n                \"startDate\": \"2022-03-30\",\n                \"endDate\": \"2022-06-30\"\n            },\n        }\n    ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n     --url https://apis.supplierxm.salsify.com/rfp/public/v1/events \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer SALSIFY_TOKEN' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n        {\n          \"events\": [\n            {\n              \"code\": \"UNIQUE-CODE-EVENT\",\n              \"data\": {\n                \"descriptionText\": [\n                  {\n                    \"data\": \"Event 1\",\n                    \"expressedIn\": {\n                      \"code\": \"fra-FR\"\n                    }\n                  }\n                ],\n                \"startDate\": \"2022-03-30\",\n                \"endDate\": \"2022-06-30\"\n              }\n            }\n          ]\n        }'"
        samples-languages:
        - curl
      tags:
      - Events
    put:
      summary: Update Event
      description: ''
      operationId: update-event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  properties:
                    uuid:
                      type: string
                      description: The uuid of the event
                    data:
                      properties:
                        descriptionText:
                          type: string
                          description: The event name
                        startDate:
                          type: string
                          description: The event start date
                        endDate:
                          type: string
                          description: The event end date
                      required:
                      - descriptionText
                      - startDate
                      - endDate
                      type: object
                  required:
                  - uuid
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"events\": [\n        {\n            \"uuid\": \"UNIQUE_ID\",\n            \"code\": \"UNIQUE-CODE-EVENT\",\n            \"data\": {\n                \"descriptionText\": [\n                    {\n                        \"data\": \"Event Name\",\n                        \"expressedIn\": {\n                            \"code\": \"fra-FR\",\n                            \"rank\": null,\n                            \"label\": \"fra-FR\",\n                            \"description\": \"fra-FR\",\n                            \"expressedIn\": [],\n                            \"_type\": \"Language\",\n                            \"data\": {\n                                \"locale\": \"fr_FR\",\n                                \"GDSN3.1\": \"fr-250\",\n                                \"GDSN2.8\": \"fr-250\"\n                            },\n                            \"normalizedCode\": \"fr\"\n                        }\n                    }\n                ],\n                \"startDate\": \"2022-03-30\",\n                \"endDate\": \"2022-06-30\"\n            }\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: UNIQUE_ID
                        code:
                          type: string
                          example: UNIQUE-CODE-EVENT
                        data:
                          type: object
                          properties:
                            descriptionText:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: string
                                    example: Event Name
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: fra-FR
                                      rank: {}
                                      label:
                                        type: string
                                        example: fra-FR
                                      description:
                                        type: string
                                        example: fra-FR
                                      expressedIn:
                                        type: array
                                      _type:
                                        type: string
                                        example: Language
                                      data:
                                        type: object
                                        properties:
                                          locale:
                                            type: string
                                            example: fr_FR
                                          GDSN3.1:
                                            type: string
                                            example: fr-250
                                          GDSN2.8:
                                            type: string
                                            example: fr-250
                                      normalizedCode:
                                        type: string
                                        example: fr
                            startDate:
                              type: string
                              example: '2022-03-30'
                            endDate:
                              type: string
                              example: '2022-06-30'
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request PUT \\\n     --url https://apis.supplierxm.salsify.com/rfp/public/v1/events \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer SALSIFY_TOKEN' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n        {\n          \"events\": [\n            {\n              \"uuid\": \"UNIQUE_ID\",\n              \"data\": {\n                \"descriptionText\": [\n                  {\n                    \"data\": \"Event 1\",\n                    \"expressedIn\": {\n                      \"code\": \"fra-FR\"\n                    }\n                  }\n                ],\n                \"startDate\": \"2022-03-30\",\n                \"endDate\": \"2022-06-30\"\n              }\n            }\n          ]\n        }'"
        samples-languages:
        - curl
      tags:
      - Events
    get:
      summary: List Event
      description: ''
      operationId: list-event-retailer
      parameters:
      - name: uuids
        in: query
        description: List of filtered event uuids
        schema:
          type: string
          default: UUID_1,UUID_2
      - name: offset
        in: query
        description: The index of the first event to be returned.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The maximum number of events to be returned.
        schema:
          type: integer
          format: int32
          default: 20
      - name: start_date
        in: query
        description: Filter events which start at a certain date
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Filter events which end at a certain date
        schema:
          type: string
          format: date
      - name: from_last_updated_at
        in: query
        description: Filter events for which the data has been updated at a certain date/time.
        schema:
          type: string
          format: date
      - name: to_last_updated_at
        in: query
        description: Filter events for which the data has been updated at a certain date/time.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"events\": [\n    {\n      \"uuid\": \"UNIQUE-ID-1\",\n      \"code\": \"EVENT-CODE-1\",\n      \"data\": {\n        \"descriptionText\": [\n          {\n            \"data\": \"EVENT NAME 1\",\n            \"expressedIn\": {\n              \"code\": \"fra-FR\",\n              \"rank\": null,\n              \"label\": \"fra-FR\",\n              \"description\": \"fra-FR\",\n              \"expressedIn\": [],\n              \"_type\": \"Language\",\n              \"data\": {\n                \"locale\": \"fr_FR\",\n                \"GDSN3.1\": \"fr-250\",\n                \"GDSN2.8\": \"fr-250\"\n              },\n              \"normalizedCode\": \"fr\"\n            }\n          }\n        ],\n        \"startDate\": \"2022-04-01\",\n        \"endDate\": \"2022-04-30\"\n      },\n    },\n    {\n      \"uuid\": \"UNIQUE-ID-2\",\n      \"code\": \"EVENT-CODE-2\",\n      \"data\": {\n        \"descriptionText\": [\n          {\n            \"data\": \"EVENT NAME 2\",\n            \"expressedIn\": {\n              \"code\": \"fra-FR\",\n              \"rank\": null,\n              \"label\": \"fra-FR\",\n              \"description\": \"fra-FR\",\n              \"expressedIn\": [],\n              \"_type\": \"Language\",\n              \"data\": {\n                \"locale\": \"fr_FR\",\n                \"GDSN3.1\": \"fr-250\",\n                \"GDSN2.8\": \"fr-250\"\n              },\n              \"normalizedCode\": \"fr\"\n            }\n          }\n        ],\n        \"startDate\": \"2022-04-01\",\n        \"endDate\": \"2022-04-23\"\n      },\n    }\n  ],\n  \"totalResults\": number of events\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Events
    delete:
      summary: Delete Event
      description: ''
      operationId: delete-event
      parameters:
      - name: uuids
        in: query
        description: List of event uuids to delete
        schema:
          type: string
          default: UUID_1,UUID_2
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'null'
              schema: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Events
    servers:
    - url: https://apis.supplierxm.salsify.com/rfp/public/
