openapi: 3.2.0
info:
  title: Tariff API
  version: '2.1'
servers:
- url: https://apis.supplierxm.salsify.com/public/v1/tariffs
security:
- sec0: []
tags:
- name: Tariff
paths:
  /:
    get:
      summary: Tariff list
      description: ''
      operationId: tariff-list
      parameters:
      - name: uuids
        in: query
        description: Filters on given uuids
        schema:
          type: array
          items:
            type: string
      - name: updated_at_from
        in: query
        description: Filter tariffs that have been updated after a certain timestamp.
        schema:
          type: string
          format: date-time
      - name: updated_at_to
        in: query
        description: Filter tariffs that have been updated before a certain timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Limit the results fetched. Cannot be greater than 100.
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: Offset the results fetched.
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"totalResults\": 1,\n  \"offset\": 0,\n  \"data\": [\n    {\n    \t\"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\",\n      \"status\": \"PUBLISHED\",\n      \"name\": \"Tariff 2019\",\n      \"sourceOrganization\": {\n        \"nameLegal\": \"Manufacturer A\"\n      },\n      \"updatedAt\": \"2021-05-26T12:53:11\",\n      \"data\": {\n      \t\"orderStartDate\": \"2021-01-01\",\n      \t\"orderEndDate\": \"2021-12-31\",\n      \t\"targetCountryList\": [{\"targetCountryCode\": {\"code\": \"FR\"}}],\n      \t\"incotermCode\": {\"code\": \"EXW\"},\n      \t\"tariffNumber\": \"tariff1\",\n      \t\"tariffCurrency\": {\"code\": \"EUR\"},\n      \t\"priceWaterfallBasisQuantityNumber\": [{\"data\": 1, \"expressedIn\": {\"code\": \"BX\"}}],\n      \t\"priceWaterfalls\": [{\n        \t\"bracketUnit\": {\"code\": \"ctn\"},\n          \"brackets\": [{\"min\": 1}, {\"min\": 10}]\n        }]\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  totalResults:
                    type: integer
                    example: 1
                    default: 0
                  offset:
                    type: integer
                    example: 0
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: aaaaaaaa-bbbb-cccc-dddd-1234567890ab
                        status:
                          type: string
                          example: PUBLISHED
                        name:
                          type: string
                          example: Tariff 2019
                        sourceOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Manufacturer A
                        updatedAt:
                          type: string
                          example: '2021-05-26T12:53:11'
                        data:
                          type: object
                          properties:
                            orderStartDate:
                              type: string
                              example: '2021-01-01'
                            orderEndDate:
                              type: string
                              example: '2021-12-31'
                            targetCountryList:
                              type: array
                              items:
                                type: object
                                properties:
                                  targetCountryCode:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: FR
                            incotermCode:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: EXW
                            tariffNumber:
                              type: string
                              example: tariff1
                            tariffCurrency:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: EUR
                            priceWaterfallBasisQuantityNumber:
                              type: array
                              items:
                                type: object
                                properties:
                                  data:
                                    type: integer
                                    example: 1
                                    default: 0
                                  expressedIn:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: BX
                            priceWaterfalls:
                              type: array
                              items:
                                type: object
                                properties:
                                  bracketUnit:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: ctn
                                  brackets:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        min:
                                          type: integer
                                          example: 1
                                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Tariff
    post:
      summary: Tariff update
      description: ''
      operationId: tariff-upsert
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"data\": [\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"priceWaterfalls\": [\n          {\n            \"bracketUnit\": {\n              \"code\": \"eur\",\n              \"description\": \"Euro\",\n              \"label\": \"euro\"\n            },\n            \"brackets\": [\n              {\n                \"min\": 1\n              },\n              {\n                \"min\": 10\n              }\n            ],\n            \"levels\": [\n              {\n                \"items\": [\n                  {\n                    \"description\": \"Prix brut\",\n                    \"type\": {\n                      \"code\": \"grossPrice\",\n                      \"key\": \"grossPrice\",\n                      \"label\": \"Gross price\"\n                    },\n                    \"unit\": {\n                      \"code\": \"$\",\n                      \"description\": \"Absolute unit type\",\n                      \"label\": \"Amount\"\n                    },\n                    \"uuid\": \"aaaaaaaa-1234-cccc-dddd-1234567890ab\",\n                    \"values\": [\n                      {\n                        \"uuid\": \"1\",\n                        \"value\": \"\"\n                      },\n                      {\n                        \"uuid\": \"2\",\n                        \"value\": \"\"\n                      }\n                    ]\n                  }\n                ],\n                \"type\": {\n                  \"code\": \"price\",\n                  \"description\": \"Price level type\",\n                  \"label\": \"HT Tariff\"\n                },\n                \"uuid\": \"aaaaaaaa-1234-bbbb-cccc-1234567890ab\"\n              }\n            ],\n            \"product\": null,\n            \"taxes\": []\n          }\n        ],\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"756\",\n              \"description\": \"Switzerland\",\n              \"label\": \"Switzerland\"\n            }\n          }\n        ]\n      },\n      \"name\": \"Tariff test public with GLN\",\n      \"sourceOrganization\": {\n        \"nameLegal\": \"Source organization - supplier\"\n      },\n      \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"nameLegal\": \"Target organization - retailer\"\n      },\n      \"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\"\n    }\n  ],\n  \"status\": \"ok\"\n}"
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        data:
                          type: object
                          properties:
                            orderStartDate:
                              type: string
                              example: '2019-05-17'
                            priceWaterfalls:
                              type: array
                              items:
                                type: object
                                properties:
                                  bracketUnit:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: eur
                                      description:
                                        type: string
                                        example: Euro
                                      label:
                                        type: string
                                        example: euro
                                  brackets:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        min:
                                          type: integer
                                          example: 1
                                          default: 0
                                  levels:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        items:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              description:
                                                type: string
                                                example: Prix brut
                                              type:
                                                type: object
                                                properties:
                                                  code:
                                                    type: string
                                                    example: grossPrice
                                                  key:
                                                    type: string
                                                    example: grossPrice
                                                  label:
                                                    type: string
                                                    example: Gross price
                                              unit:
                                                type: object
                                                properties:
                                                  code:
                                                    type: string
                                                    example: $
                                                  description:
                                                    type: string
                                                    example: Absolute unit type
                                                  label:
                                                    type: string
                                                    example: Amount
                                              uuid:
                                                type: string
                                                example: aaaaaaaa-1234-cccc-dddd-1234567890ab
                                              values:
                                                type: array
                                                items:
                                                  type: object
                                                  properties:
                                                    uuid:
                                                      type: string
                                                      example: '1'
                                                    value:
                                                      type: string
                                                      example: ''
                                        type:
                                          type: object
                                          properties:
                                            code:
                                              type: string
                                              example: price
                                            description:
                                              type: string
                                              example: Price level type
                                            label:
                                              type: string
                                              example: HT Tariff
                                        uuid:
                                          type: string
                                          example: aaaaaaaa-1234-bbbb-cccc-1234567890ab
                                  product: {}
                                  taxes:
                                    type: array
                            targetCountryList:
                              type: array
                              items:
                                type: object
                                properties:
                                  targetCountryCode:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                        example: '756'
                                      description:
                                        type: string
                                        example: Switzerland
                                      label:
                                        type: string
                                        example: Switzerland
                        name:
                          type: string
                          example: Tariff test public with GLN
                        sourceOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Source organization - supplier
                        status:
                          type: string
                          example: DRAFT
                        targetOrganization:
                          type: object
                          properties:
                            nameLegal:
                              type: string
                              example: Target organization - retailer
                        uuid:
                          type: string
                          example: aaaaaaaa-bbbb-cccc-dddd-1234567890ab
                  status:
                    type: string
                    example: ok
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
