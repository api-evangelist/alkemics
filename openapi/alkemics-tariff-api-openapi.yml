          code: "curl -H 'Authorization: Bearer SALSIFY_TOKEN' -XPOST 'https://apis.supplierxm.salsify.com/public/v1/tariffs' -H 'Content-Type: application/json' -d '{\n  \"data\": [\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"tariffNumber\": \"2019-123456-00\",\n        \"orderEndDate\": null,\n        \"incotermCode\": {\n          \"code\": \"FCA\",\n          \"description\": \"Free carrier\",\n          \"label\": \"FREE CARRIER\"\n        },\n        \"tariffCurrency\": {\n          \"code\": \"EUR\",\n          \"label\": \"euro\",\n          \"key\": \"EUR\"\n        },\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"250\",\n              \"description\": \"France\",\n              \"label\": \"France\"\n            }\n          }\n        ],\n        \"priceWaterfallBasisQuantityNumber\": [\n          {\n            \"expressedIn\": {\n              \"code\": \"cnt\",\n              \"description\": \"count\",\n              \"label\": \"count\"\n            },\n            \"data\": 1\n          }\n        ],\n        \"priceWaterfalls\": [\n          {\n            \"bracketUnit\": {\n              \"code\": \"eur\"\n            },\n            \"brackets\": [\n              {\n                \"min\": 1\n              },\n              {\n                \"min\": 10\n              }\n            ],\n            \"levels\": [\n              {\n                \"items\": [\n                  {\n                    \"description\": \"Prix brut\",\n                    \"type\": {\n                      \"code\": \"grossPrice\"\n                    },\n                    \"unit\": {\n                      \"code\": \"$\"\n                    },\n                    \"uuid\": \"aaaaaaaa-1234-cccc-dddd-1234567890ab\",\n                    \"values\": [\n                      {\n                        \"uuid\": \"1\",\n                        \"value\": \"\"\n                      },\n                      {\n                        \"uuid\": \"2\",\n                        \"value\": \"\"\n                      }\n                    ]\n                  }\n                ],\n                \"type\": {\n                  \"code\": \"price\"\n                },\n                \"uuid\": \"aaaaaaaa-1234-bbbb-cccc-1234567890ab\"\n              }\n            ],\n            \"product\": null,\n            \"taxes\": []\n          }\n        ]\n      },\n      \"name\": \"Tariff test public with GLN\",\n      \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"gln\": \"3663836000117\"\n      },\n      \"type\": 0\n    },\n    {\n      \"data\": {\n        \"orderStartDate\": \"2019-05-17\",\n        \"targetCountryList\": [\n          {\n            \"targetCountryCode\": {\n              \"code\": \"756\"\n            }\n          }\n        ]\n      },\n      \"name\": \"Tariff 2 updated with GLN\",\n      \"status\": \"DRAFT\",\n      \"targetOrganization\": {\n        \"gln\": \"12345678\",\n        \"id\": 123,\n        \"nameLegal\": \"Senate Retailer 1\"\n      },\n      \"type\": 0,\n      \"uuid\": \"aaaaaaaa-bbbb-cccc-dddd-1234567890ab\"\n    }\n  ]\n}'\n"
        samples-languages:
