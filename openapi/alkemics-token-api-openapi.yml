tags:
- name: Token
paths:
  /v2/token:
    post:
      summary: Create Token
      description: 'The token can be obtained from the authentication server with your secret credentials. It expires after 2 hours.

        When your API receives an HTTP 401 error you will need to re-authenticate using your credentials.


        Those credentials were given to you when you registered on the platform. They are strictly confidential and must remain secret.'
      operationId: token-v2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: your client_id
                client_secret:
                  type: string
                  description: your client-secret
                grant_type:
                  type: string
                  description: the type of credentials used to retrieve the token, should be "client_credentials"
                  default: client_credentials
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"access_token\": \"GENERATED_TOKEN\",\n  \"type\": \"JWT\"\n}"
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: GENERATED_TOKEN
                  type:
                    type: string
                    example: JWT
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
