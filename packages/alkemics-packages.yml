note: >-
  IMPORTANT — none of these is an API client SDK. Alkemics never published a client
  library for its own API, and no such package exists on npm, PyPI, RubyGems,
  Packagist, crates.io, NuGet, Maven Central or pkg.go.dev. What the company did
  publish, and still owns, is a small set of general-purpose open-source developer
  utilities under the github.com/alkemics organization. They are recorded here as
  genuine first-party output and as dated decay evidence, but NO common[] SDKs
  pointer is emitted from this file: there is no Alkemics API for them to wrap, so
  crediting them as SDKs would be false credit.
  The GitHub organization survived the October 2020 Salsify acquisition and is still
  maintained (goflow last pushed 2026-08-03), which is the only live first-party
  engineering surface the Alkemics name still has.
